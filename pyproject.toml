[project]
name = "tex2sto"
version = "0.1.0"
description = "Compile a controlled LaTeX dialect to SSAU-compliant DOCX and PDF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mikhail Polevoda", email = "snail1704@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["docx", "latex", "pandoc", "ssau"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-docx>=1.2.0,<2",
]

[project.urls]
Documentation = "https://github.com/snailUlitka/tex2sto/tree/main/docs"
Issues = "https://github.com/snailUlitka/tex2sto/issues"
Repository = "https://github.com/snailUlitka/tex2sto"

[project.scripts]
tex2sto = "tex2sto.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
